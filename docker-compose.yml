services:
  ui:
    build:
      context: .
      args:
        NEXT_PUBLIC_DEV_URL: ${NEXT_PUBLIC_DEV_URL}
        NEXT_PUBLIC_GTAG: ${NEXT_PUBLIC_GTAG}
        RAS_URL: ${RAS_URL}
        NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
